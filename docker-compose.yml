services:
  # HEDit API service
  hedit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hedit-api
    volumes:
      - feedback_data:/app/feedback
      - telemetry_data:/app/telemetry
    environment:
      # LLM Provider Configuration (Anthropic via Claude Platform on AWS)
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}

      # Anthropic Configuration (all three required)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://aws-external-anthropic.us-east-2.api.aws}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID}
      - ANNOTATION_MODEL=${ANNOTATION_MODEL:-claude-haiku-4-5}
      - EVALUATION_MODEL=${EVALUATION_MODEL:-claude-haiku-4-5}
      - VISION_MODEL=${VISION_MODEL:-claude-haiku-4-5}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}

      # HED Configuration
      - HED_SCHEMA_VERSION=${HED_SCHEMA_VERSION:-8.4.0}
      - USE_JS_VALIDATOR=${USE_JS_VALIDATOR:-true}
      # HED paths are set in Dockerfile, override here if needed
      # - HED_SCHEMA_DIR=/app/hed-schemas/schemas_latest_json
      # - HED_VALIDATOR_PATH=/app/hed-javascript
    ports:
      - "38427:38427"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38427/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  feedback_data:
    driver: local
  telemetry_data:
    driver: local
