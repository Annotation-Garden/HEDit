# Docker Compose for HEDit Development Environment
# Pulls from GHCR :develop tag instead of building locally
#
# Usage:
#   docker compose -f docker-compose.dev.yml pull
#   docker compose -f docker-compose.dev.yml up -d
#
# Auto-update:
#   ./deploy/auto-update-dev.sh

services:
  # HEDit Dev API service
  hedit-dev:
    image: ghcr.io/annotation-garden/hedit:dev
    container_name: hedit-dev
    volumes:
      - feedback_data_dev:/app/feedback
    environment:
      # LLM Provider Configuration (Anthropic via Claude Platform on AWS)
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}

      # Anthropic Configuration (all three required)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://aws-external-anthropic.us-east-2.api.aws}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID}
      - ANNOTATION_MODEL=${ANNOTATION_MODEL:-claude-haiku-4-5}
      - EVALUATION_MODEL=${EVALUATION_MODEL:-claude-haiku-4-5}
      - VISION_MODEL=${VISION_MODEL:-claude-haiku-4-5}

      # LLM Settings
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}

      # HED Configuration
      - HED_SCHEMA_VERSION=${HED_SCHEMA_VERSION:-8.4.0}
      - USE_JS_VALIDATOR=${USE_JS_VALIDATOR:-true}

      # API Security
      - API_KEYS=${API_KEYS}
      - REQUIRE_API_AUTH=${REQUIRE_API_AUTH:-true}

      # Dev-specific settings
      - LOG_LEVEL=DEBUG
    ports:
      - "127.0.0.1:38428:38427"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38427/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  feedback_data_dev:
    driver: local
