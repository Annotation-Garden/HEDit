name = "hedit-api"
main = "index.js"
compatibility_date = "2024-01-01"

# Kept explicit: once routes are declared, wrangler turns workers_dev off on
# deploy unless it is set, which would take the hedit-api.<account>.workers.dev
# name down while clients are still moving to the edge host below. Turn it off
# once nothing uses the workers.dev name.
workers_dev = true

# Browser-facing edge: edge.<domain>/<project>. The DNS record
# (edge.annotation.garden AAAA 100::, proxied) exists only to carry routes.
# "/hedit*" also matches "/hedit-dev/...", but the dev route below is more
# specific and wins; a "/hedit-dev" path that reaches this Worker is outside
# its "/hedit/" mount and answered 404.
routes = [
  { pattern = "edge.annotation.garden/hedit*", zone_name = "annotation.garden" },
]

# Workers Logs: without this, console.warn/console.error (misconfiguration,
# out-of-mount requests, unhandled errors) are visible only to someone running
# `wrangler tail` at that moment.
[observability]
enabled = true
head_sampling_rate = 1.0

# KV Namespaces for caching
[[kv_namespaces]]
binding = "HED_CACHE"
id = "7625fc43d3c24ed2ba33c769ad044ee9"

# KV Namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "49665add38394107aad8ef8386af98ec"

# Environment variables
[vars]
ENVIRONMENT = "production"
BACKEND_URL = "https://api.annotation.garden/hedit"
# Where this Worker is path-mounted (see resolveRoutePath in index.js). Both are
# required; the Worker answers 500 if either is missing or malformed.
EDGE_HOST = "edge.annotation.garden"
MOUNT_PREFIX = "/hedit"

# Secrets (set via wrangler secret put)
# Run: wrangler secret put BACKEND_API_KEY
# BACKEND_API_KEY = API key for authenticating with backend (X-API-Key header)
#
# Run: wrangler secret put TURNSTILE_SECRET_KEY
# TURNSTILE_SECRET_KEY = Cloudflare Turnstile secret key for bot protection

# =============================================================================
# Development environment
# Deployed from develop by .github/workflows/deploy-workers.yml; by hand:
#   bunx cfman wrangler --account <account> deploy --env dev
# Secrets: bunx cfman wrangler --account <account> secret put BACKEND_API_KEY --env dev
# (secret values live in Infisical: annot-garden project, dev /hedit/edge)
# =============================================================================
[env.dev]
name = "hedit-dev-api"
workers_dev = true
vars = { ENVIRONMENT = "development", BACKEND_URL = "https://api.annotation.garden/hedit-dev", EDGE_HOST = "edge.annotation.garden", MOUNT_PREFIX = "/hedit-dev" }
routes = [
  { pattern = "edge.annotation.garden/hedit-dev*", zone_name = "annotation.garden" },
]

[env.dev.observability]
enabled = true
head_sampling_rate = 1.0

# Dev-specific KV namespaces (separate from production)
[[env.dev.kv_namespaces]]
binding = "HED_CACHE"
id = "368630a8c973475f962fc3dcb8568cfc"

[[env.dev.kv_namespaces]]
binding = "RATE_LIMITER"
id = "98e1cfde831e4d98b1dea4ee358f54b9"
